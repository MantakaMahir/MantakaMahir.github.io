<body class="bg-ivory-canvas text-dark-teal-ink flex justify-center min-h-screen">
  <div id="root" class="w-full max-w-[420px] min-h-screen bg-ivory-canvas shadow-2xl relative flex flex-col justify-between"></div>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext } = React;
    const DeviceContext = createContext(null);
    const { createRoot } = ReactDOM;
    const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

    // ponytail: session-only prototype state; actual BLE integration replaces simulation.
    const PrototypeProvider = ({ children }) => {
      const [connection, setConnection] = useState('disconnected');
      const [paired, setPaired] = useState(false);
      const [calibrated, setCalibrated] = useState(false);
      const [mode, setMode] = useState('first-time');
      const [cleared, setCleared] = useState(false);
      const reset = () => { setConnection('disconnected'); setPaired(false); setCalibrated(false); setMode('first-time'); setCleared(true); };
      return <DeviceContext.Provider value={{connection,setConnection,paired,setPaired,calibrated,setCalibrated,mode,setMode,cleared,setCleared,reset}}>{children}</DeviceContext.Provider>;
    };
    const RouteScroll = () => { const location = useLocation(); useEffect(() => { window.scrollTo(0,0); }, [location.pathname]); return null; };
    // Common screen components
    const StatusHeader = ({ showBack = false, onBack, title, rightElement }) => {
      const navigate = useNavigate();
      return (
        <div className="w-full pt-2 px-5 flex flex-col">
          <div className="h-9 w-full flex items-center justify-between text-[13px] font-semibold text-dark-teal-ink/90 select-none">
            <span>9:41</span>
            <div className="flex items-center gap-1.5 text-teal-primary">
              <span className="material-symbols-outlined text-[17px] leading-none">signal_cellular_alt</span>
              <span className="material-symbols-outlined text-[17px] leading-none">wifi</span>
              <span className="material-symbols-outlined text-[19px] leading-none">battery_full</span>
            </div>
          </div>
          {(showBack || title || rightElement) && (
            <div className="flex items-center justify-between py-2">
              {showBack ? (
                <button
                  onClick={onBack ? onBack : () => navigate(-1)}
                  className="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-dark-teal-ink hover:bg-teal-soft active:scale-95 transition-all"
                  aria-label="Go back"
                >
                  <span className="material-symbols-outlined text-[22px]">arrow_back</span>
                </button>
              ) : <div className="w-10" />}
              {title && (
                <h1 className="font-bold text-dark-teal-ink text-[17px] tracking-tight">{title}</h1>
              )}
              {rightElement || <div className="w-10" />}
            </div>
          )}
        </div>
      );
    };

    const BottomNavigation = () => {
      const location = useLocation();
      const current = location.pathname;

      const tabs = [
        { path: '/home', label: 'Home', icon: 'self_improvement' },
        { path: '/history', label: 'History', icon: 'stacked_bar_chart' },
        { path: '/device', label: 'Device', icon: 'circle' },
        { path: '/settings', label: 'Settings', icon: 'tune' },
      ];

      return (
        <nav className="fixed bottom-0 max-w-[420px] w-full z-50 pb-safe bg-pure-surface/95 backdrop-blur-xl border-t border-whisper-border">
          <div className="flex justify-around items-center h-16 px-2">
            {tabs.map(tab => {
              const active = current === tab.path;
              return (
                <Link
                  key={tab.path}
                  to={tab.path}
                  className={`flex flex-col items-center justify-center min-w-[64px] h-12 transition-all ${
                    active ? 'text-primary-container font-semibold' : 'text-quiet-stone hover:text-dark-teal-ink'
                  }`}
                >
                  <span className={`flex items-center justify-center w-10 h-6 rounded-full transition-colors ${
                    active ? 'bg-teal-mist/70' : ''
                  }`}>
                    <span className="material-symbols-outlined text-[20px]">{tab.icon}</span>
                  </span>
                  <span className="text-[11px] mt-0.5 font-medium">{tab.label}</span>
                  <span className={`w-1 h-1 rounded-full bg-primary-container transition-opacity ${
                    active ? 'opacity-100 mt-0.5' : 'opacity-0'
                  }`} />
                </Link>
              );
            })}
          </div>
        </nav>
      );
    };

    // Screen 1: Welcome & Landing (Serene Jewelry Introduction)
    const WelcomeScreen = () => {
      const navigate = useNavigate();
      const device = useContext(DeviceContext);
      return (
        <div className="flex flex-col min-h-screen justify-between p-6 select-none">
          <StatusHeader />
          <div className="flex flex-col items-center text-center mt-2">
            <header className="flex flex-col items-center justify-center pt-2 pb-3">
              <div className="h-10 w-auto flex items-center justify-center">
                <div className="flex items-center gap-2">
                  <span className="material-symbols-outlined text-primary-container text-3xl">spa</span>
                  <span className="font-bold text-xl tracking-tight text-dark-teal-ink">YourVitaminP</span>
                </div>
              </div>
              <div className="mt-1 flex items-center gap-1.5">
                <span className="inline-block w-1.5 h-1.5 rounded-full bg-secondary"></span>
                <span className="text-[11px] tracking-widest uppercase text-quiet-stone font-semibold">
                  Better Posture • Brighter Tomorrows
                </span>
              </div>
            </header>

            <section className="relative w-full my-3 flex justify-center">
              <div className="absolute inset-0 max-w-[280px] mx-auto rounded-full bg-gradient-to-b from-gold-mist/40 via-teal-mist/30 to-transparent blur-2xl -z-10 transform scale-105"></div>
              <div className="relative w-full max-w-[310px] rounded-3xl bg-pure-surface shadow-md p-4 overflow-hidden flex flex-col items-center border border-whisper-border">
                <div className="relative w-full aspect-[4/5] rounded-2xl overflow-hidden bg-ivory-canvas">
                  <img
                    className="w-full h-full object-cover object-center"
                    alt="Editorial close-up of luxury biometric pendant"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuBVbKHEQFVQEhGMM2LhW17XF6cGtPgOpYUnEaUxYYjxh5TL0a57PtduuHeMsRuJpNGTTvZv0dHsoE4_FwRFHhJhtH3tD-vy-KLACwnS1mxbbpNsybhieqMytziqeCdSpTjc89xSul07gVfcwul1GvXYfdzlcDQlwZMITv5-idof1Qy2mtd6qzG6nFWEeda16ypzLLvmgzA-n4eZq2JfTk-hv0fQMuIlPmA9V0LM1UVf86U8nwdqp6TT"
                  />
                  <div className="absolute bottom-3 left-3 right-3 py-2 px-3 rounded-full bg-pure-surface/90 backdrop-blur-md shadow-sm flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span className="relative flex h-2 w-2">
                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-60"></span>
                        <span className="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
                      </span>
                      <span className="text-[12px] text-dark-teal-ink font-semibold">Dual-Capsule Sensory Core</span>
                    </div>
                    <span className="text-[11px] text-quiet-stone font-medium">Pendant design concept</span>
                  </div>
                </div>

                <div className="mt-3 w-full flex items-center justify-between px-1">
                  <div className="flex items-center gap-1.5">
                    <span className="w-1.5 h-1.5 rounded-full bg-primary-container"></span>
                    <span className="text-[11px] text-quiet-stone">Silent haptic touch</span>
                  </div>
                  <div className="w-8 h-[1px] bg-whisper-border"></div>
                  <div className="flex items-center gap-1.5">
                    <span className="w-1.5 h-1.5 rounded-full bg-secondary"></span>
                    <span className="text-[11px] text-quiet-stone">Everyday posture awareness</span>
                  </div>
                </div>
              </div>
            </section>

            <section className="flex flex-col items-center text-center px-1">
              <div className="inline-flex items-center gap-1.5 py-1 px-3.5 rounded-full bg-teal-mist/60 text-dark-teal-ink mb-2">
                <span className="material-symbols-outlined text-[14px]">spa</span>
                <span className="text-[12px] font-semibold">Tu dosis diaria de equilibrio</span>
              </div>
              <h1 className="text-[26px] leading-tight text-dark-teal-ink font-bold tracking-tight">
                Awareness, then balance.
              </h1>
              <p className="text-[13px] text-on-surface-variant max-w-[285px] mt-2 leading-relaxed">
                YourVitaminP gently observes your natural poise throughout the day, inspiring effortless upright grace without intrusive alerts.
              </p>
            </section>
          </div>

          <footer className="flex flex-col items-center w-full mt-5 gap-2">
            <button
              onClick={() => { device.reset(); device.setCleared(false); navigate('/permissions'); }}
              className="w-full h-[52px] rounded-2xl bg-teal-primary text-pure-surface font-semibold text-[15px] flex items-center justify-center gap-2 shadow-md active:scale-[0.98] transition-transform hover:bg-[#0a4243]"
            >
              <span>Set up my pendant</span>
              <span className="material-symbols-outlined text-[18px]">arrow_forward</span>
            </button>
            <button
              onClick={() => { device.setMode('returning'); device.setPaired(true); device.setCalibrated(true); device.setConnection('checking'); navigate('/pairing'); }}
              className="h-[44px] text-on-surface-variant hover:text-dark-teal-ink text-[13px] font-medium transition-colors flex items-center gap-1"
            >
              <span>I already set it up</span>
              <span className="material-symbols-outlined text-[16px] text-quiet-stone">chevron_right</span>
            </button>
            <p className="text-[11px] text-quiet-stone mt-1 text-center">
              Crafted for personal posture poise and mindful living.
            </p>
          </footer>
        </div>
      );
    };

    // Screen 2: Permissions Step
    const PermissionsScreen = () => {
      const navigate = useNavigate();
      return (
        <div className="flex flex-col min-h-screen justify-between p-6 select-none">
          <StatusHeader
            showBack={true}
            rightElement={
              <div className="inline-flex items-center px-3 py-1 rounded-full bg-teal-soft border border-whisper-border text-teal-primary text-[12px] font-semibold">
                Step 2 of 6
              </div>
            }
          />
          <main className="flex-1 flex flex-col justify-center px-2 py-4">
            <div className="flex items-center justify-center mb-5">
              <div className="w-16 h-16 rounded-2xl bg-white border border-whisper-border shadow-sm flex items-center justify-center relative overflow-hidden">
                <div className="w-6 h-10 relative flex flex-col items-center justify-center gap-[2px]">
                  <div className="w-5 h-[18px] rounded-t-full bg-gold-accent shadow-inner"></div>
                  <div className="w-5 h-[18px] rounded-b-full bg-teal-primary shadow-inner"></div>
                </div>
              </div>
            </div>

            <div className="text-center px-2 mb-6">
              <h1 className="text-[24px] leading-tight font-bold text-dark-teal-ink tracking-tight mb-2">
                Stay connected when it matters
              </h1>
              <p className="text-[13px] text-graphite font-normal max-w-[310px] mx-auto leading-relaxed">
                Allow these permissions to enable seamless communication with your pendant.
              </p>
            </div>

            <div className="flex flex-col gap-3.5 w-full">
              <article className="bg-white rounded-2xl p-4 border border-whisper-border shadow-sm flex items-start gap-3.5">
                <div className="w-11 h-11 rounded-xl bg-teal-soft border border-whisper-border flex items-center justify-center flex-shrink-0 text-teal-primary mt-0.5">
                  <span className="material-symbols-outlined text-[22px]">bluetooth</span>
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center justify-between mb-1">
                    <h2 className="text-[15px] font-semibold text-dark-teal-ink tracking-tight">Bluetooth</h2>
                    <span className="text-[10px] font-semibold uppercase tracking-wider text-teal-primary bg-teal-soft px-2 py-0.5 rounded-full border border-teal-mist/50">Required</span>
                  </div>
                  <p className="text-[12px] leading-[18px] text-graphite">
                    Find your pendant and keep device status current.
                  </p>
                </div>
              </article>

              <article className="bg-white rounded-2xl p-4 border border-whisper-border shadow-sm flex items-start gap-3.5">
                <div className="w-11 h-11 rounded-xl bg-gold-soft border border-[#F2E7D5] flex items-center justify-center flex-shrink-0 text-gold-accent mt-0.5">
                  <span className="material-symbols-outlined text-[22px]">notifications</span>
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center justify-between mb-1">
                    <h2 className="text-[15px] font-semibold text-dark-teal-ink tracking-tight">Notifications</h2>
                    <span className="text-[10px] font-semibold uppercase tracking-wider text-quiet-stone bg-[#F2F4F3] px-2 py-0.5 rounded-full border border-whisper-border">Optional</span>
                  </div>
                  <p className="text-[12px] leading-[18px] text-graphite">
                    Get useful posture, connection, and low-battery reminders. You control frequency.
                  </p>
                </div>
              </article>
            </div>

            <p className="text-[12px] text-quiet-stone text-center mt-5">
              You can change these permissions later in Settings.
            </p>
          </main>

          <footer className="w-full flex flex-col items-center gap-2 pt-2">
            <button
              onClick={() => navigate('/pairing')}
              className="w-full h-[52px] rounded-2xl bg-teal-primary text-ivory-canvas font-semibold text-[15px] flex items-center justify-center shadow-sm active:scale-[0.99] transition-transform hover:bg-[#0a4243]"
            >
              Continue
            </button>
            <button
              onClick={() => navigate('/pairing')}
              className="w-full h-[40px] flex items-center justify-center text-[14px] font-medium text-dark-teal-ink/75 hover:text-dark-teal-ink"
            >
              Not now
            </button>
            <div className="w-28 h-1 bg-dark-teal-ink/20 rounded-full mt-1 mb-1"></div>
          </footer>
        </div>
      );
    };

    // Screen 3: Pairing & Device Discovery Step
    const PairingScreen = () => {
      const navigate = useNavigate();
      const device = useContext(DeviceContext);
      const userMode = device.mode;
      const [flowState, setFlowState] = useState(device.mode === 'returning' ? 'checking' : 'first-time');
      const changeState = (state) => {
        if (state === 'first-time') { device.setMode('first-time'); device.setPaired(false); device.setCalibrated(false); }
        if (state === 'connected') device.setPaired(true);
        setFlowState(state);
        device.setConnection(state === 'first-time' ? 'disconnected' : state);
      };
      const changeMode = (mode) => {
        device.setMode(mode);
        if (mode === 'returning') { device.setPaired(true); device.setCalibrated(true); changeState('checking'); }
        else changeState('first-time');
      };

      return (
        <div className="flex flex-col min-h-screen justify-between p-6 select-none">
          <StatusHeader
            showBack={true}
            rightElement={
              <div className="flex items-center gap-1.5 px-3 py-1 rounded-full bg-teal-mist text-primary-container">
                <span className="text-[12px] font-semibold">Step 3 of 6</span>
              </div>
            }
          />
          <div className="flex flex-col text-center mt-2">
            <h1 className="text-[24px] font-bold text-dark-teal-ink tracking-tight">
              {flowState === 'first-time' && 'Find and pair your pendant'}
              {flowState === 'checking' && 'Checking your pendant connection'}
              {flowState === 'connected' && 'Pendant connected'}
              {flowState === 'disconnected' && 'Your pendant is not connected'}
            </h1>
            <p className="text-[13px] text-on-surface-variant mt-1.5 max-w-[310px] mx-auto leading-relaxed">
              {flowState === 'first-time' && 'Keep your pendant nearby and scan for it.'}
              {flowState === 'checking' && (device.paired ? 'Your pendant is saved. Checking whether it is connected now.' : 'Pairing your pendant and checking its Bluetooth connection.')}
              {flowState === 'connected' && 'Bluetooth connection confirmed. Live posture can become available after calibration.'}
              {flowState === 'disconnected' && (device.paired ? 'Your pairing is saved, but the Bluetooth connection is unavailable.' : 'No pendant is paired. Scan to begin setup.')}
            </p>
          </div>

          <p className="text-[12px] text-quiet-stone text-center mt-3">When you open the app, it checks the connection to your saved pendant.</p>
          <p className="text-[11px] text-secondary text-center">Prototype simulation — choose a connection result below. No real Bluetooth connection is made.</p>
          {/* Prototype State switcher */}
          <div className="flex flex-col items-center w-full my-3">
            <div className="flex items-center gap-1.5 p-1 bg-surface-container rounded-lg mb-2 text-[11px] font-medium">
              <span className="text-quiet-stone px-1">Mode:</span>
              <button
                onClick={() => changeMode('first-time')}
                className={`px-2.5 py-0.5 rounded-md transition-all ${userMode === 'first-time' ? 'bg-pure-surface text-dark-teal-ink shadow-sm font-semibold' : 'text-on-surface-variant'}`}
              >
                First-time
              </button>
              <button
                onClick={() => changeMode('returning')}
                className={`px-2.5 py-0.5 rounded-md transition-all ${userMode === 'returning' ? 'bg-pure-surface text-dark-teal-ink shadow-sm font-semibold' : 'text-on-surface-variant'}`}
              >
                Returning
              </button>
            </div>
            <div className="flex flex-wrap items-center justify-center gap-1 p-1 bg-surface-container/70 rounded-xl w-full">
              {['first-time', 'checking', 'connected', 'disconnected'].map((st) => (
                <button
                  key={st}
                  onClick={() => changeState(st)}
                  className={`px-2 py-0.5 text-[11px] rounded-lg capitalize transition-all ${flowState === st ? 'bg-pure-surface text-dark-teal-ink shadow-sm font-semibold' : 'text-on-surface-variant'}`}
                >
                  {st}
                </button>
              ))}
            </div>
          </div>

          {/* Ambient Animation Visual */}
          <div className="relative flex items-center justify-center my-3 w-full py-2 overflow-hidden">
            <div className="absolute w-52 h-52 rounded-full bg-gold-mist/30 animate-ping opacity-25" style={{ animationDuration: '3.5s' }} />
            <div className="absolute w-44 h-44 rounded-full bg-teal-mist/40" />
            <div className="absolute w-32 h-32 rounded-full bg-pure-surface shadow-sm" />

            <div className="relative z-10 flex flex-col items-center justify-center p-3">
              <div className="w-16 h-24 relative flex flex-col items-center justify-center gap-[2px]">
                <div className="w-12 h-10 rounded-t-full bg-gradient-to-b from-[#F2E7D5] via-[#D9B778] to-[#9C7735] shadow-inner" />
                <div className="w-12 h-14 rounded-b-full bg-gradient-to-b from-[#4AA8A4] via-[#0C4F50] to-[#013134] shadow-md flex items-center justify-center">
                  <div className="w-1.5 h-1.5 rounded-full bg-ivory-canvas/80" />
                </div>

            {/* Privacy Card */}
            <div className="p-3.5 rounded-2xl bg-teal-mist/30 border border-whisper-border flex items-start gap-2.5">
              <span className="material-symbols-outlined text-primary-container text-[18px] mt-0.5">verified_user</span>
              <div className="text-[12px]">
                <span className="font-bold text-dark-teal-ink block">Privacy-first by design</span>
                <p className="text-on-surface-variant text-[11px] mt-0.5">
                  Opt-in only, granular category controls, zero advertising, and immediate revocation at any time.
                </p>
              </div>
            </div>

            {/* 6 Step Concept Storyboard */}
            <div className="flex flex-col gap-3">
              <div className="flex items-center justify-between text-[13px] font-bold text-dark-teal-ink">
                <span>6-step flow architecture</span>
                <span className="text-[10px] font-normal text-quiet-stone">Storyboard</span>
              </div>

              <div className="space-y-3">
                <div className="p-3.5 bg-pure-surface rounded-xl border border-whisper-border shadow-sm flex items-start gap-3">
                  <span className="w-6 h-6 rounded-full bg-teal-mist flex items-center justify-center font-bold text-[11px] text-primary shrink-0">1</span>
                  <div>
                    <h3 className="text-[13px] font-bold text-dark-teal-ink">Add or invite a companion</h3>
                    <p className="text-[11px] text-on-surface-variant">Invite method and account/backend requirements will be defined in a future phase.</p>
                  </div>
                </div>

                <div className="p-3.5 bg-pure-surface rounded-xl border border-whisper-border shadow-sm flex items-start gap-3">
                  <span className="w-6 h-6 rounded-full bg-teal-mist flex items-center justify-center font-bold text-[11px] text-primary shrink-0">2</span>
                  <div>
                    <h3 className="text-[13px] font-bold text-dark-teal-ink">Mutual consent & acceptance</h3>
                    <p className="text-[11px] text-on-surface-variant">Both participants must explicitly confirm before data exchange begins.</p>
                  </div>
                </div>

                <div className="p-3.5 bg-pure-surface rounded-xl border border-whisper-border shadow-sm flex flex-col gap-2">
                  <div className="flex items-start gap-3">
                    <span className="w-6 h-6 rounded-full bg-teal-mist flex items-center justify-center font-bold text-[11px] text-primary shrink-0">3</span>
                    <div>
                      <h3 className="text-[13px] font-bold text-dark-teal-ink">Granular category selection</h3>
                      <p className="text-[11px] text-on-surface-variant">Preview sharing choices only — no data is actually shared:</p>
                    </div>
                  </div>

                  <div className="space-y-1.5 pl-9">
                    <div className="flex items-center justify-between text-[12px] bg-ivory-canvas p-2 rounded-lg">
                      <span className="font-semibold text-dark-teal-ink">Posture progress</span>
                      <button
                        role="switch" aria-label="Posture sharing concept preview" aria-checked={sharePosture} onClick={() => setSharePosture(!sharePosture)}
                        className={`w-9 h-5 rounded-full p-0.5 flex items-center ${sharePosture ? 'bg-primary-container justify-end' : 'bg-surface-container justify-start'}`}
                      >
                        <div className="w-4 h-4 rounded-full bg-pure-surface" />
                      </button>
                    </div>
                    <div className="flex items-center justify-between text-[12px] bg-ivory-canvas p-2 rounded-lg">
                      <span className="font-semibold text-dark-teal-ink">Steps & activity</span>
                      <button
                        role="switch" aria-label="Activity sharing concept preview" aria-checked={shareActivity} onClick={() => setShareActivity(!shareActivity)}
                        className={`w-9 h-5 rounded-full p-0.5 flex items-center ${shareActivity ? 'bg-primary-container justify-end' : 'bg-surface-container justify-start'}`}
                      >
                        <div className="w-4 h-4 rounded-full bg-pure-surface" />
                      </button>
                    </div>
                    <div className="flex items-center justify-between text-[12px] bg-ivory-canvas p-2 rounded-lg">
                      <span className="font-semibold text-dark-teal-ink">Heart rate & SpO2</span>
                      <button
                        role="switch" aria-label="Wellness sharing concept preview" aria-checked={shareWellness} onClick={() => setShareWellness(!shareWellness)}
                        className={`w-9 h-5 rounded-full p-0.5 flex items-center ${shareWellness ? 'bg-primary-container justify-end' : 'bg-surface-container justify-start'}`}
                      >
                        <div className="w-4 h-4 rounded-full bg-pure-surface" />
                      </button>
                    </div>
                  </div>
                </div>

                <div className="p-3.5 bg-pure-surface rounded-xl border border-whisper-border shadow-sm flex items-start gap-3">
                  <span className="w-6 h-6 rounded-full bg-teal-mist flex items-center justify-center font-bold text-[11px] text-primary shrink-0">4</span>
                  <div>
                    <h3 className="text-[13px] font-bold text-dark-teal-ink">Quiet shared progress</h3>
                    <p className="text-[11px] text-on-surface-variant">Calm paired awareness without competitive rankings or notifications.</p>
                  </div>
                </div>

                <div className="p-3.5 bg-pure-surface rounded-xl border border-whisper-border shadow-sm flex items-start gap-3">
                  <span className="w-6 h-6 rounded-full bg-teal-mist flex items-center justify-center font-bold text-[11px] text-primary shrink-0">5</span>
                  <div>
                    <h3 className="text-[13px] font-bold text-dark-teal-ink">Adjust or pause permissions</h3>
                    <p className="text-[11px] text-on-surface-variant">Mute sharing at any moment without awkward alerts sent to peers.</p>
                  </div>
                </div>

                <div className="p-3.5 bg-pure-surface rounded-xl border border-whisper-border shadow-sm flex items-start gap-3">
                  <span className="w-6 h-6 rounded-full bg-teal-mist flex items-center justify-center font-bold text-[11px] text-primary shrink-0">6</span>
                  <div>
                    <h3 className="text-[13px] font-bold text-dark-teal-ink">Revoke access & remove</h3>
                    <p className="text-[11px] text-on-surface-variant">Remove the connection and revoke future sharing access. Data retention behavior will be defined later.</p>
                  </div>
                </div>
              </div>
            </div>
          </main>

          <footer className="pt-4">
            <button
              onClick={() => navigate('/settings')}
              className="w-full h-[50px] rounded-xl border border-whisper-border bg-pure-surface text-primary-container font-semibold text-[14px] flex items-center justify-center gap-2 shadow-sm"
            >
              <span className="material-symbols-outlined text-[18px]">arrow_back</span>
              <span>Return to Settings</span>
            </button>
          </footer>
        </div>
      );
    };

    // Root App Container
    const App = () => {
      return (
        <PrototypeProvider><MemoryRouter initialEntries={['/']}><RouteScroll />
          <Routes>
            <Route path="/" element={<WelcomeScreen />} />
            <Route path="/permissions" element={<PermissionsScreen />} />
            <Route path="/pairing" element={<PairingScreen />} />
            <Route path="/wear-guidance" element={<WearGuidanceScreen />} />
            <Route path="/calibration" element={<CalibrationScreen />} />
            <Route path="/home" element={<HomeScreen />} />
            <Route path="/history" element={<HistoryScreen />} />
            <Route path="/device" element={<DeviceScreen />} />
            <Route path="/settings" element={<SettingsScreen />} />
            <Route path="/troubleshooting" element={<TroubleshootingScreen />} />
            <Route path="/session-detail" element={<SessionDetailScreen />} />
            <Route path="/friends-sharing" element={<FriendsSharingScreen />} />
          </Routes>
        </MemoryRouter></PrototypeProvider>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
